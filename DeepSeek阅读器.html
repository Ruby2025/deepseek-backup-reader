<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeepSeek 备份阅读器</title>
<style>
:root{
  --bg:#ffffff; --side:#f9fafb; --line:#e5e7eb; --text:#1f2329; --sub:#8b8f98; --accent:#4d6bfe;
  --bubble:#eff6ff; --hover:#eef0f4; --active:#e4eaff; --code:#f4f5f7; --mark:#ffe58a; --warn:#b45309; --warnbg:#fff7e6;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#1b1c20; --side:#141518; --line:#2c2e34; --text:#e6e7ea; --sub:#8a8d96; --accent:#7c93ff;
    --bubble:#2a3550; --hover:#23252b; --active:#2a3150; --code:#25272d; --mark:#6b5a12; --warn:#f0b35a; --warnbg:#33290f;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg)}
button,input,select{font:inherit;color:inherit}
#app{display:flex;height:100%}
#side{width:290px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:16px 16px 8px;font-weight:700;font-size:17px;color:var(--accent)}
.side-pad{padding:0 12px 8px;display:flex;flex-direction:column;gap:8px}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 12px;cursor:pointer}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{padding:3px 10px;font-size:13px;border-radius:8px}
select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 8px;width:100%}
.search{position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 30px 7px 10px;outline:none}
.search input:focus{border-color:var(--accent)}
.search button{position:absolute;right:4px;top:4px;border:0;background:none;cursor:pointer;color:var(--sub);font-size:17px;line-height:1;padding:5px 7px}
#searchInfo{font-size:12px;color:var(--sub);padding:0 4px;min-height:18px}
#list{flex:1;overflow:auto;padding:0 8px 16px;min-height:0}
.grp{font-size:12px;color:var(--sub);padding:14px 10px 4px}
.item{padding:7px 10px;border-radius:10px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.item:hover{background:var(--hover)}
.item.active{background:var(--active);color:var(--accent)}
.item.missing{opacity:.45}
.item .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .n{font-size:11px;color:var(--sub);flex:none}
.hit{padding:4px 10px 4px 18px;font-size:13px;color:var(--sub);cursor:pointer;border-radius:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hit:hover{background:var(--hover);color:var(--text)}
.hit b{font-weight:600;color:var(--text)}
mark{background:var(--mark);color:inherit;border-radius:2px}
main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
#head{padding:12px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;min-height:58px}
#head .ttl{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#head .meta{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#head .grow{flex:1;min-width:0}
#scroll{flex:1;overflow:auto;min-height:0}
#thread{max-width:860px;margin:0 auto;padding:24px 24px 80px}
.welcome{max-width:560px;margin:12vh auto 0;padding:0 24px;text-align:center}
.welcome h1{font-size:22px;margin:0 0 8px}
.welcome p{color:var(--sub);margin:6px 0}
.welcome .row{display:flex;gap:10px;justify-content:center;margin:18px 0;flex-wrap:wrap}
.msg{margin:0 0 26px}
.msg.user{display:flex;flex-direction:column;align-items:flex-end}
.msg.user .body{background:var(--bubble);border-radius:16px;padding:10px 16px;max-width:82%}
.utext{white-space:pre-wrap;word-break:break-word}
.utext.clamp{max-height:9.5em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
.more{border:0;background:none;color:var(--accent);cursor:pointer;padding:4px 0 0;font-size:13px}
.msg.flash .body{animation:flash 1.6s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 3px transparent}}
.msg.ai .body{border-radius:10px}
.foot{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--sub);margin-top:4px;min-height:22px}
.pager{display:inline-flex;align-items:center;gap:2px;color:var(--text);font-size:13px}
.pager button{border:0;background:none;cursor:pointer;padding:0 6px;font-size:16px;line-height:20px;border-radius:6px}
.pager button:hover:not(:disabled){background:var(--hover)}
.pager button:disabled{opacity:.3;cursor:default}
.foot .act{border:0;background:none;cursor:pointer;color:var(--sub);padding:0 4px;font-size:12px;border-radius:6px}
.foot .act:hover{color:var(--accent)}
.tag{background:var(--warnbg);color:var(--warn);border-radius:6px;padding:0 6px}
details.fold{margin:0 0 10px;border-left:2px solid var(--line);padding-left:12px;color:var(--sub);font-size:14px}
details.fold>summary{cursor:pointer;user-select:none;list-style:none;padding:2px 0}
details.fold>summary::before{content:"▸ "}
details.fold[open]>summary::before{content:"▾ "}
details.fold>summary::-webkit-details-marker{display:none}
.think-body{white-space:pre-wrap;word-break:break-word;padding:4px 0 6px}
.srcs{margin:4px 0 6px;padding:0;list-style:none}
.srcs li{margin:0 0 8px}
.srcs a{color:var(--accent);text-decoration:none}
.srcs a:hover{text-decoration:underline}
.srcs .site{font-size:12px}
.srcs .snip{font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.toolline{font-size:13px;color:var(--sub);margin:0 0 8px;border-left:2px solid var(--line);padding-left:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toolline a{color:var(--accent);text-decoration:none}
.note{font-size:12px;color:var(--sub);margin-top:6px}
.filtered{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:8px 12px;display:inline-block}
.files{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-bottom:6px;max-width:82%}
.chip{border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:13px;background:var(--bg)}
.chip small{color:var(--sub)}
.files img{max-width:260px;max-height:260px;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;display:block}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md p{margin:.7em 0}
.md h1,.md h2,.md h3,.md h4{margin:1.2em 0 .5em;line-height:1.4}
.md h1{font-size:1.45em}.md h2{font-size:1.28em}.md h3{font-size:1.13em}.md h4{font-size:1em}
.md ul,.md ol{padding-left:1.5em;margin:.6em 0}
.md li{margin:.25em 0}
.md blockquote{margin:.7em 0;padding:.1em 1em;border-left:3px solid var(--line);color:var(--sub)}
.md code{background:var(--code);border-radius:5px;padding:.1em .35em;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
.md pre{background:var(--code);border-radius:10px;padding:12px 14px;overflow:auto}
.md pre code{background:none;padding:0}
.md table{border-collapse:collapse;margin:.8em 0;display:block;overflow:auto;max-width:100%}
.md th,.md td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.md th{background:var(--side)}
.md hr{border:0;border-top:1px solid var(--line);margin:1.2em 0}
.md a{color:var(--accent)}
.fab{position:absolute;right:22px;bottom:22px;display:flex;flex-direction:column;gap:8px}
.fab button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.fab button:hover{background:var(--hover)}
.err{color:var(--warn);padding:40px 0;text-align:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand">DeepSeek 备份阅读器</div>
    <div class="side-pad">
      <button class="btn" id="openBtn">打开备份文件夹…</button>
      <select id="backupSel" hidden title="切换备份"></select>
      <div class="search">
        <input id="q" placeholder="搜索标题，按回车搜索全文" autocomplete="off">
        <button id="qClear" title="清除" hidden>×</button>
      </div>
      <div id="searchInfo"></div>
    </div>
    <nav id="list"></nav>
  </aside>
  <main>
    <header id="head" hidden>
      <div class="grow">
        <div class="ttl" id="ttl"></div>
        <div class="meta" id="meta"></div>
      </div>
      <button class="btn small" id="resetBtn" title="回到导出时最后停留的那条分支">回到原分支</button>
      <button class="btn small" id="exportBtn" title="把当前显示的这条分支导出为 Markdown 文件">导出 Markdown</button>
    </header>
    <div id="scroll">
      <div id="thread"></div>
    </div>
    <div class="fab" id="fab" hidden>
      <button id="toTop" title="回到顶部">↑</button>
      <button id="toBottom" title="跳到底部">↓</button>
    </div>
  </main>
</div>
<input type="file" id="dirInput" webkitdirectory multiple hidden>

<script>
'use strict';
const $ = s => document.querySelector(s);
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
const nfc = s => s.normalize('NFC');
const INDEX_NAME = 'chat_session_index.json';
const MAP_NAME = '重命名对照表.csv';

let FS = new Map();          // 相对路径 -> () => Promise<File>
let backups = [];            // {name, prefix, sessions, byId, fileOf}
let cur = null;              // 当前备份
let T = null;                // 当前对话的树
let renderToken = 0;
let objectUrls = [];
let searchIndex = null;      // Map<backupPrefix, Map<id, [[msgId, role, text],...]>>
let fullQuery = '';          // 当前全文搜索词
const thread = $('#thread'), scroller = $('#scroll');

/* ---------- 读取文件夹 ---------- */
async function walk(handle, path, depth, out){
  for await (const [name, h] of handle.entries()){
    if (name.startsWith('.')) continue;
    const p = path + '/' + name;
    if (h.kind === 'file') out.set(nfc(p), () => h.getFile());
    else if (depth < 5) await walk(h, p, depth + 1, out);
  }
}
async function readText(path){
  const g = FS.get(path);
  if (!g) throw new Error('找不到文件：' + path);
  return (await g()).text();
}
function idb(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('ds-backup-reader', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function kvSet(k, v){ try { const db = await idb(); await new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); } catch (e) {} }
async function kvGet(k){ try { const db = await idb(); return await new Promise((res, rej) => { const r = db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); } catch (e) { return undefined; } }
function lsGet(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }

async function pickFolder(){
  if (window.showDirectoryPicker){
    let h;
    try { h = await window.showDirectoryPicker({ id: 'ds-backup', mode: 'read' }); }
    catch (e) { return; }
    await loadFromHandle(h);
    kvSet('dir', h);
  } else {
    $('#dirInput').value = ''; $('#dirInput').click();
  }
}
async function loadFromHandle(h){
  showStatus('正在读取文件夹…');
  const out = new Map();
  await walk(h, h.name, 0, out);
  await loadFS(out);
}
$('#dirInput').addEventListener('change', async e => {
  const out = new Map();
  for (const f of e.target.files){
    const p = f.webkitRelativePath || f.name;
    if (p.split('/').some(s => s.startsWith('.'))) continue;
    out.set(nfc(p), () => Promise.resolve(f));
  }
  if (out.size) await loadFS(out);
});
$('#openBtn').onclick = pickFolder;

async function loadFS(map){
  FS = map; backups = []; cur = null; T = null; searchIndex = null; fullQuery = '';
  for (const p of FS.keys()){
    if (p === INDEX_NAME || p.endsWith('/' + INDEX_NAME)){
      const prefix = p.slice(0, -INDEX_NAME.length);
      const name = prefix.replace(/\/$/, '').split('/').pop() || '备份';
      backups.push({ name, prefix });
    }
  }
  backups.sort((a, b) => b.name.localeCompare(a.name));
  const sel = $('#backupSel');
  sel.innerHTML = '';
  for (const b of backups){ const o = el('option', '', b.name); o.value = b.prefix; sel.append(o); }
  sel.hidden = backups.length < 2;
  if (!backups.length){
    showWelcome('这个文件夹里没有找到 DeepSeek 备份（需要包含 chat_session_index.json 和 chat_sessions 文件夹）。');
    $('#list').innerHTML = '';
    return;
  }
  const last = lsGet('ds-last-backup');
  await openBackup(backups.find(b => b.prefix === last) || backups[0]);
}
$('#backupSel').onchange = e => openBackup(backups.find(b => b.prefix === e.target.value));

function parseCSV(text){
  const rows = []; let row = [], cell = '', q = false;
  text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i + 1] === '"'){ cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ','){ row.push(cell); cell = ''; }
    else if (c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (c !== '\r') cell += c;
  }
  if (cell || row.length){ row.push(cell); rows.push(row); }
  return rows;
}

async function openBackup(b){
  cur = b; T = null; fullQuery = '';
  $('#backupSel').value = b.prefix;
  lsSet('ds-last-backup', b.prefix);
  showStatus('正在读取对话列表…');
  if (!b.sessions){
    let idx = [];
    try { idx = JSON.parse(await readText(b.prefix + INDEX_NAME)); } catch (e) {}
    b.sessions = Array.isArray(idx) ? idx : [];
    b.byId = new Map(b.sessions.map(s => [s.id, s]));
    b.fileOf = new Map();
    const dir = b.prefix + 'chat_sessions/';
    const jsons = [...FS.keys()].filter(p => p.startsWith(dir) && p.endsWith('.json') && !p.slice(dir.length).includes('/'));
    const titleIds = new Map();
    for (const s of b.sessions){ const k = nfc(String(s.title || '').trim()); if (!titleIds.has(k)) titleIds.set(k, []); titleIds.get(k).push(s.id); }
    const nameToId = new Map();
    if (FS.has(b.prefix + MAP_NAME)){
      try { for (const r of parseCSV(await readText(b.prefix + MAP_NAME)).slice(1)) if (r[0] && r[2]) nameToId.set(nfc(r[2]), r[0]); } catch (e) {}
    }
    const unmatched = [];
    for (const p of jsons){
      const file = p.slice(dir.length), base = file.slice(0, -5);
      let id = null;
      if (b.byId.has(base)) id = base;
      else if (nameToId.has(file) && b.byId.has(nameToId.get(file))) id = nameToId.get(file);
      else { const t = titleIds.get(base); if (t && t.length === 1) id = t[0]; }
      if (id && !b.fileOf.has(id)) b.fileOf.set(id, p); else unmatched.push(p);
    }
    for (const p of unmatched){            // 文件名对不上的，打开看里面的 id
      try {
        const j = JSON.parse(await readText(p));
        if (j && j.id && !b.fileOf.has(j.id)){
          b.fileOf.set(j.id, p);
          if (!b.byId.has(j.id)){
            const s = { id: j.id, title: j.title || p.slice(dir.length, -5), pinned: !!j.pinned, message_count: (j.messages || []).length, inserted_at: j.inserted_at, updated_at: j.updated_at };
            b.sessions.push(s); b.byId.set(s.id, s);
          }
        }
      } catch (e) {}
    }
  }
  $('#q').value = ''; $('#qClear').hidden = true; $('#searchInfo').textContent = '';
  renderList();
  const last = lsGet('ds-last-session');
  if (last && b.fileOf.has(last)) openSession(last);
  else showWelcome(`已读取「${b.name}」，共 ${b.sessions.length} 个对话。在左侧选择一个对话开始阅读。`, true);
}

/* ---------- 左侧列表 ---------- */
function fmtTime(s){ if (!s) return ''; const d = new Date(s); if (isNaN(d)) return ''; const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function renderList(){
  const list = $('#list'); list.innerHTML = '';
  if (!cur) return;
  const q = $('#q').value.trim().toLowerCase();
  let items = cur.sessions.slice().sort((a, b) => String(b.updated_at).localeCompare(String(a.updated_at)));
  if (q) items = items.filter(s => String(s.title).toLowerCase().includes(q));
  const groups = new Map();
  for (const s of items){
    const g = s.pinned && !q ? '置顶' : fmtTime(s.updated_at).slice(0, 7) || '未知时间';
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(s);
  }
  const keys = [...groups.keys()].sort((a, b) => a === '置顶' ? -1 : b === '置顶' ? 1 : b.localeCompare(a));
  const frag = document.createDocumentFragment();
  for (const g of keys){
    frag.append(el('div', 'grp', g));
    for (const s of groups.get(g)) frag.append(listItem(s));
  }
  if (!items.length) frag.append(el('div', 'grp', q ? '没有标题匹配的对话，按回车搜索全文' : '没有对话'));
  list.append(frag);
}
function listItem(s, count){
  const d = el('div', 'item');
  d.dataset.id = s.id;
  if (!cur.fileOf.has(s.id)){ d.classList.add('missing'); d.title = '备份里没有找到这个对话的文件'; }
  if (T && T.id === s.id) d.classList.add('active');
  d.append(el('span', 't', s.title || '（无标题）'));
  d.append(el('span', 'n', count != null ? count + ' 处' : String(s.message_count ?? '')));
  d.onclick = () => openSession(s.id);
  return d;
}
function markActive(){
  for (const n of document.querySelectorAll('#list .item')) n.classList.toggle('active', !!T && n.dataset.id === T.id);
  const act = document.querySelector('#list .item.active'); if (act) act.scrollIntoView({ block: 'nearest' });
}

/* ---------- 搜索 ---------- */
const qInput = $('#q');
qInput.addEventListener('input', () => {
  $('#qClear').hidden = !qInput.value;
  fullQuery = '';
  $('#searchInfo').textContent = qInput.value.trim() ? '按回车搜索所有对话的正文' : '';
  renderList();
});
qInput.addEventListener('keydown', e => { if (e.key === 'Enter' && qInput.value.trim()) fullSearch(qInput.value.trim()); });
$('#qClear').onclick = () => { qInput.value = ''; $('#qClear').hidden = true; fullQuery = ''; $('#searchInfo').textContent = ''; renderList(); qInput.focus(); };

function msgText(m, withThink){
  const out = [];
  for (const f of m.fragments || []){
    if (f.type === 'REQUEST' || f.type === 'RESPONSE' || f.type === 'TEMPLATE_RESPONSE' || (withThink && f.type === 'THINK')) if (f.content) out.push(f.content);
  }
  return out.join('\n\n');
}
async function buildIndex(b){
  if (!searchIndex) searchIndex = new Map();
  if (searchIndex.has(b.prefix)) return searchIndex.get(b.prefix);
  const idx = new Map();
  const ids = [...b.fileOf.keys()];
  let done = 0, next = 0;
  async function worker(){
    while (next < ids.length){
      const id = ids[next++];
      try {
        const j = JSON.parse(await readText(b.fileOf.get(id)));
        const arr = [];
        for (const m of j.messages || []){ const t = msgText(m, false); if (t) arr.push([m.id, m.role === 'USER' ? 0 : 1, t]); }
        idx.set(id, arr);
      } catch (e) {}
      if (++done % 10 === 0 || done === ids.length) $('#searchInfo').textContent = `正在建立全文索引 ${done}/${ids.length}…`;
    }
  }
  await Promise.all(Array.from({ length: 6 }, worker));
  searchIndex.set(b.prefix, idx);
  return idx;
}
function esc(s){ return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
async function fullSearch(query){
  const b = cur; if (!b) return;
  const idx = await buildIndex(b);
  if (cur !== b || qInput.value.trim() !== query) return;
  fullQuery = query;
  const q = query.toLowerCase();
  const results = [];
  let total = 0;
  for (const s of b.sessions){
    const arr = idx.get(s.id); if (!arr) continue;
    let n = 0; const hits = [];
    for (const [mid, role, text] of arr){
      const low = text.toLowerCase();
      let pos = low.indexOf(q); if (pos < 0) continue;
      if (hits.length < 3) hits.push({ mid, role, text, pos });
      while (pos >= 0){ n++; pos = low.indexOf(q, pos + q.length); }
    }
    const inTitle = String(s.title).toLowerCase().includes(q);
    if (n || inTitle){ results.push({ s, n, hits }); total += n; }
  }
  results.sort((a, c) => c.n - a.n);
  const list = $('#list'); list.innerHTML = '';
  $('#searchInfo').textContent = `全文搜索：${results.length} 个对话，共 ${total} 处`;
  const frag = document.createDocumentFragment();
  for (const r of results){
    frag.append(listItem(r.s, r.n));
    for (const h of r.hits){
      const d = el('div', 'hit');
      const a = Math.max(0, h.pos - 18);
      const pre = (a > 0 ? '…' : '') + h.text.slice(a, h.pos).replace(/\s+/g, ' ');
      const mid = h.text.slice(h.pos, h.pos + q.length);
      const post = h.text.slice(h.pos + q.length, h.pos + q.length + 60).replace(/\s+/g, ' ');
      d.innerHTML = `<b>${h.role ? 'AI' : '我'}：</b>${esc(pre)}<mark>${esc(mid)}</mark>${esc(post)}`;
      d.onclick = () => openSession(r.s.id, h.mid);
      frag.append(d);
    }
  }
  if (!results.length) frag.append(el('div', 'grp', '没有找到'));
  list.append(frag);
}

/* ---------- 对话树 ---------- */
function buildTree(d, path){
  const by = new Map(), kids = new Map();
  for (const m of d.messages || []) by.set(m.id, m);
  for (const m of by.values()){
    m._pk = (m.parent_id == null || !by.has(m.parent_id)) ? 'root' : m.parent_id;
    if (!kids.has(m._pk)) kids.set(m._pk, []);
    kids.get(m._pk).push(m.id);
  }
  let forks = 0;
  for (const a of kids.values()){ a.sort((x, y) => x - y); if (a.length > 1) forks++; }
  T = { id: d.id, data: d, by, kids, sel: new Map(), forks, filePath: path };
  selectTo(d.current_message_id);
}
function selectTo(id){
  let m = T.by.get(id);
  while (m){ T.sel.set(m._pk, m.id); m = T.by.get(m.parent_id); }
}
function pathNow(){
  const out = []; let k = 'root';
  for (;;){
    const c = T.kids.get(k); if (!c) break;
    let pick = T.sel.get(k);
    if (pick == null || !c.includes(pick)) pick = c[c.length - 1];
    out.push(pick); k = pick;
  }
  return out;
}

async function openSession(id, jumpTo){
  if (!cur) return;
  const p = cur.fileOf.get(id), meta = cur.byId.get(id);
  if (!T || T.id !== id){
    renderToken++;
    for (const u of objectUrls) URL.revokeObjectURL(u); objectUrls = [];
    thread.innerHTML = '';
    $('#head').hidden = false; $('#fab').hidden = false;
    $('#ttl').textContent = (meta && meta.title) || '（无标题）';
    $('#meta').textContent = '';
    if (!p){ T = null; thread.append(el('div', 'err', '备份里没有找到这个对话的文件。')); markActive(); return; }
    let d;
    try { d = JSON.parse(await readText(p)); }
    catch (e){ T = null; thread.append(el('div', 'err', '读取失败：' + e.message)); markActive(); return; }
    buildTree(d, p);
    lsSet('ds-last-session', id);
    $('#ttl').textContent = d.title || (meta && meta.title) || '（无标题）';
    markActive();
    scroller.scrollTop = 0;
  }
  if (jumpTo != null && T.by.has(jumpTo)) selectTo(jumpTo);
  const ok = await renderPath();
  if (!ok) return;
  if (jumpTo != null){
    const n = thread.querySelector(`.msg[data-id="${jumpTo}"]`);
    if (n){ const c = n.querySelector('.utext.clamp'); if (c){ c.classList.remove('clamp'); const mb = n.querySelector('.more'); if (mb) mb.textContent = '收起'; } n.scrollIntoView({ block: 'center' }); n.classList.remove('flash'); void n.offsetWidth; n.classList.add('flash'); }
  }
}
function updateMeta(pathLen){
  const d = T.data;
  $('#meta').textContent = `共 ${T.by.size} 条消息 · 当前分支 ${pathLen} 条` + (T.forks ? ` · ${T.forks} 处有多个版本` : '') + ` · ${fmtTime(d.inserted_at)} 创建 · ${fmtTime(d.updated_at)} 更新`;
  $('#resetBtn').hidden = !T.forks;
}
async function renderPath(){
  const token = ++renderToken;
  const path = pathNow();
  updateMeta(path.length);
  const nodes = [...thread.children];
  let i = 0;
  while (i < nodes.length && i < path.length && Number(nodes[i].dataset.id) === path[i]) i++;
  for (let j = nodes.length - 1; j >= i; j--) nodes[j].remove();
  while (i < path.length){
    const frag = document.createDocumentFragment();
    const end = Math.min(path.length, i + 40);
    for (; i < end; i++) frag.append(renderMsg(T.by.get(path[i])));
    thread.append(frag);
    if (i < path.length){
      await new Promise(r => setTimeout(r));
      if (token !== renderToken) return false;
    }
  }
  return true;
}
async function switchSibling(m, delta){
  const sibs = T.kids.get(m._pk);
  const i = sibs.indexOf(m.id) + delta;
  if (i < 0 || i >= sibs.length) return;
  const old = thread.querySelector(`.msg[data-id="${m.id}"]`);
  const top = old ? old.getBoundingClientRect().top : 0;
  T.sel.set(m._pk, sibs[i]);
  const done = renderPath();
  const now = thread.querySelector(`.msg[data-id="${sibs[i]}"]`);
  if (old && now) scroller.scrollTop += now.getBoundingClientRect().top - top;
  await done;
}
$('#resetBtn').onclick = async () => {
  if (!T) return;
  T.sel = new Map(); selectTo(T.data.current_message_id);
  await renderPath();
};
$('#toTop').onclick = () => scroller.scrollTo({ top: 0 });
$('#toBottom').onclick = () => scroller.scrollTo({ top: scroller.scrollHeight });

/* ---------- 渲染消息 ---------- */
DOMPurify.addHook('afterSanitizeAttributes', node => {
  if (node.tagName === 'A'){ node.setAttribute('target', '_blank'); node.setAttribute('rel', 'noopener noreferrer'); }
});
function mdToHtml(text){
  let html;
  try { html = marked.parse(text, { gfm: true, breaks: true }); }
  catch (e) { return esc(text).replace(/\n/g, '<br>'); }
  return DOMPurify.sanitize(html, { FORBID_TAGS: ['img', 'style', 'form', 'input', 'button', 'iframe', 'video', 'audio', 'svg', 'math'], FORBID_ATTR: ['style', 'class', 'id'] });
}
function safeUrl(u){ return typeof u === 'string' && /^https?:\/\//i.test(u) ? u : null; }
function link(url, text){
  const u = safeUrl(url);
  if (!u) return el('span', '', text);
  const a = el('a', '', text); a.href = u; a.target = '_blank'; a.rel = 'noopener noreferrer';
  return a;
}
function fold(summary, open){
  const d = el('details', 'fold'); d.append(el('summary', '', summary)); if (open) d.open = true; return d;
}
function sourceList(results){
  const ul = el('ul', 'srcs');
  for (const r of results || []){
    const li = el('li');
    li.append(link(r.url || r.source_page_url, r.title || r.url || r.source_page_url || '（无标题）'));
    if (r.site_name) li.append(el('span', 'site', ' · ' + r.site_name));
    if (r.snippet) li.append(el('div', 'snip', String(r.snippet).replace(/\s+/g, ' ')));
    ul.append(li);
  }
  return ul;
}
function fmtSize(n){ if (!n && n !== 0) return ''; if (n < 1024) return n + ' B'; if (n < 1048576) return (n / 1024).toFixed(1) + ' KB'; return (n / 1048576).toFixed(1) + ' MB'; }
function resolveAttachment(exportPath){
  if (!exportPath) return null;
  const name = nfc(exportPath.split('/').pop());
  const cands = [T.filePath.slice(0, -5) + '_files/' + name, cur.prefix + nfc(exportPath), cur.prefix + 'chat_sessions/' + T.id + '_files/' + name];
  for (const c of cands) if (FS.has(c)) return c;
  return null;
}
function renderFiles(files){
  const box = el('div', 'files');
  for (const f of files || []){
    const p = f.is_image ? resolveAttachment(f.export_path) : null;
    if (p){
      const img = el('img'); img.alt = f.file_name || ''; img.title = f.file_name || '';
      FS.get(p)().then(file => { const u = URL.createObjectURL(file); objectUrls.push(u); img.src = u; img.onclick = () => window.open(u, '_blank'); }).catch(() => {});
      box.append(img);
    } else {
      const c = el('div', 'chip');
      c.append((f.is_image ? '🖼 ' : '📄 ') + (f.file_name || '文件') + ' ');
      c.append(el('small', '', f.is_image ? '图片未包含在备份中' : fmtSize(f.file_size)));
      box.append(c);
    }
  }
  return box;
}
const STATUS = { INCOMPLETE: '未完成', CONTENT_FILTER: '被内容过滤' };
function renderMsg(m){
  const user = m.role === 'USER';
  const wrap = el('div', 'msg ' + (user ? 'user' : 'ai'));
  wrap.dataset.id = m.id;
  const body = el('div', 'body');
  let hasBody = false;
  for (const f of m.fragments || []){
    switch (f.type){
      case 'FILE': wrap.append(renderFiles(f.files)); break;
      case 'REQUEST': {
        const u = el('div', 'utext', f.content || ''); body.append(u);
        if ((f.content || '').length > 1200){
          u.classList.add('clamp');
          const t = el('button', 'more', '展开全部');
          t.onclick = () => { const c = u.classList.toggle('clamp'); t.textContent = c ? '展开全部' : '收起'; };
          body.append(t);
        }
        hasBody = true; break;
      }
      case 'RESPONSE': { const d = el('div', 'md'); d.innerHTML = mdToHtml(f.content || ''); body.append(d); hasBody = true; break; }
      case 'THINK': {
        const d = fold('已深度思考' + (f.elapsed_secs ? `（用时 ${Math.round(f.elapsed_secs)} 秒）` : ''));
        d.append(el('div', 'think-body', f.content || '')); body.append(d); hasBody = true; break;
      }
      case 'TOOL_SEARCH': {
        const n = (f.results || []).length;
        const d = fold(`联网搜索：${(f.queries || []).join(' · ') || '…'}（${n} 个结果）`);
        d.append(sourceList(f.results)); body.append(d); hasBody = true; break;
      }
      case 'TOOL_IMAGE_SEARCH': {
        const d = fold(`图片搜索（${(f.results || []).length} 个结果）`);
        d.append(sourceList(f.results)); body.append(d); hasBody = true; break;
      }
      case 'READ_LINK': {
        const n = (f.results || []).length;
        if (n){ const d = fold(`读取链接（${n} 个）`); d.append(sourceList(f.results)); body.append(d); }
        else body.append(el('div', 'toolline', '读取链接'));
        hasBody = true; break;
      }
      case 'TOOL_OPEN': {
        const d = el('div', 'toolline'); d.append('打开网页：', link(f.url, f.title || f.url || ''));
        if (f.site_name) d.append(' · ' + f.site_name);
        body.append(d); hasBody = true; break;
      }
      case 'TEMPLATE_RESPONSE': body.append(el('div', 'filtered', f.content || '')); hasBody = true; break;
      case 'CONTENT_RISK': body.append(el('div', 'note', f.content || '')); hasBody = true; break;
      default: {
        const d = fold('其他内容：' + f.type); const pre = el('div', 'think-body', JSON.stringify(f, null, 2)); d.append(pre); body.append(d); hasBody = true;
      }
    }
  }
  if (hasBody) wrap.append(body);
  const foot = el('div', 'foot');
  const sibs = T.kids.get(m._pk) || [];
  if (sibs.length > 1){
    const i = sibs.indexOf(m.id);
    const pg = el('span', 'pager');
    pg.title = user ? '这条消息被重新编辑过，点击切换版本' : '这条回复被重新生成过，点击切换版本';
    const prev = el('button', '', '‹'), next = el('button', '', '›');
    prev.disabled = i === 0; next.disabled = i === sibs.length - 1;
    prev.onclick = () => switchSibling(m, -1); next.onclick = () => switchSibling(m, 1);
    pg.append(prev, el('span', '', `${i + 1} / ${sibs.length}`), next);
    foot.append(pg);
  }
  if (STATUS[m.status]) foot.append(el('span', 'tag', STATUS[m.status]));
  foot.append(el('span', '', fmtTime(m.inserted_at)));
  const cp = el('button', 'act', '复制');
  cp.onclick = async () => {
    const t = msgText(m, false);
    try { await navigator.clipboard.writeText(t); }
    catch (e){ const ta = el('textarea'); ta.value = t; document.body.append(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
    cp.textContent = '已复制'; setTimeout(() => cp.textContent = '复制', 1200);
  };
  foot.append(cp);
  wrap.append(foot);
  return wrap;
}

/* ---------- 导出 ---------- */
$('#exportBtn').onclick = () => {
  if (!T) return;
  const d = T.data, lines = [`# ${d.title || '对话'}`, '', `> 创建 ${fmtTime(d.inserted_at)} · 更新 ${fmtTime(d.updated_at)} · 导出的是阅读器里当前显示的分支`, ''];
  for (const id of pathNow()){
    const m = T.by.get(id);
    const files = (m.fragments || []).filter(f => f.type === 'FILE').flatMap(f => f.files || []).map(f => f.file_name).filter(Boolean);
    const text = msgText(m, false);
    if (!text && !files.length) continue;
    lines.push(m.role === 'USER' ? '## 我' : '## DeepSeek', '');
    if (files.length) lines.push('附件：' + files.join('、'), '');
    if (text) lines.push(text, '');
  }
  const blob = new Blob([lines.join('\n')], { type: 'text/markdown;charset=utf-8' });
  const a = el('a'); a.href = URL.createObjectURL(blob);
  a.download = String(d.title || '对话').replace(/[\/\\:*?"<>|\n\r\t]/g, '_').slice(0, 80) + '.md';
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
};

/* ---------- 欢迎页 ---------- */
function showStatus(text){
  $('#head').hidden = true; $('#fab').hidden = true;
  thread.innerHTML = ''; const w = el('div', 'welcome'); w.append(el('p', '', text)); thread.append(w);
}
async function showWelcome(msg, loaded){
  $('#head').hidden = true; $('#fab').hidden = true;
  thread.innerHTML = '';
  const w = el('div', 'welcome');
  w.append(el('h1', '', 'DeepSeek 备份阅读器'));
  if (msg) w.append(el('p', '', msg));
  if (!loaded){
    w.append(el('p', '', '选择存放备份的文件夹（比如「Deepseek backup」），里面的每个备份都会被识别出来。'));
    w.append(el('p', '', '所有内容只在这台电脑的浏览器里读取，不会上传到任何地方。'));
    const row = el('div', 'row');
    const b1 = el('button', 'btn primary', '打开备份文件夹…'); b1.onclick = pickFolder; row.append(b1);
    const saved = window.showDirectoryPicker ? await kvGet('dir') : null;
    if (saved){
      const b2 = el('button', 'btn', `重新打开「${saved.name}」`);
      b2.onclick = async () => {
        try { if ((await saved.requestPermission({ mode: 'read' })) === 'granted') await loadFromHandle(saved); }
        catch (e) { pickFolder(); }
      };
      row.prepend(b2);
    }
    w.append(row);
  }
  thread.append(w);
}
showWelcome();
